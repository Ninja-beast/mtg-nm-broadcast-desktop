<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Starting Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Playfair+Display:ital,wght@1,700&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Sora', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #223041;
    overflow: hidden;
    color: #111;
  }

  /* ---------- LOGO ---------- */
  .logo-block {
    display: none !important;
    position: absolute;
    left: 40px;
    top: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 132px;
  }

  .logo-mark {
    width: 108px;
    height: 132px;
    width: auto;
    display: block;
  }

  .logo-text-year {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #f7d375, #b8862c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }

  .logo-text-name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #111;
    line-height: 1.3;
  }

  /* ---------- TOP16 PANEL ---------- */
  .top16-panel {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 440px;
    height: 705px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-transform: uppercase;
  }

  .top16-header {
    height: 34px;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 16px;
    font-weight: 800;
    gap: 8px;
  }

  .top16-header .title-group {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }

  .top16-header .crown {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .top16-header #widgetTitle {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top16-header #widgetRound {
    white-space: nowrap;
    flex-shrink: 0;
  }

  .top16-rows {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    --scale: 1;
    --row-height: 34px;
  }

  .top16-row {
    height: var(--row-height);
    display: grid;
    grid-template-columns: calc(26px * var(--scale)) calc(34px * var(--scale)) 1fr calc(66px * var(--scale));
    align-items: center;
    background: linear-gradient(90deg, #9f0c22 0%, #c71535 72%, #c71434 100%);
    color: #fff;
    font-weight: 800;
    border-radius: 8px !important;
    overflow: hidden !important;
  }

  .top16-row .rank {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(16px * var(--scale));
    background: #000;
    border-radius: 8px 0 0 8px !important;
  }

  .top16-row .flag {
    width: calc(26px * var(--scale));
    height: calc(18px * var(--scale));
    justify-self: center;
    object-fit: cover;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
  }

  .top16-row .name {
    padding-left: calc(6px * var(--scale));
    font-size: calc(14px * var(--scale));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top16-row .record {
    text-align: center;
    font-size: calc(14px * var(--scale));
  }

  .top16-row.empty {
    opacity: 0.8;
  }

  /* ---------- B-ROLL PLACEHOLDER ---------- */
  .zone-label {
    position: absolute;
    font-style: italic;
    font-weight: 700;
    font-size: 22px;
    color: #111;
  }

  .broll-label {
    display: none !important;
    left: 510px;
    top: 162px;
  }

  .broll-box {
    display: none !important;
    position: absolute;
    left: 510px;
    top: 190px;
    width: 960px;
    height: 592px;
    border: 2px dashed #111;
    box-sizing: border-box;
  }

  .broll-box::before,
  .broll-box::after {
    content: "";
    position: absolute;
    inset: 0;
  }

  .broll-box::before {
    background: linear-gradient(to bottom right, transparent calc(50% - 1px), #111 50%, transparent calc(50% + 1px));
  }

  .broll-box::after {
    background: linear-gradient(to bottom left, transparent calc(50% - 1px), #111 50%, transparent calc(50% + 1px));
  }

  .broll-caption {
    display: none !important;
    position: absolute;
    left: 510px;
    top: 190px;
    width: 960px;
    height: 592px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #111;
  }

  /* ---------- CHAT PLACEHOLDER ---------- */
  .chat-label {
    display: none !important;
    left: 1520px;
    top: 162px;
    color: #c0111f;
  }

  .chat-box {
    display: none !important;
    position: absolute;
    left: 1520px;
    top: 190px;
    width: 346px;
    height: 592px;
    border: 2px solid #c0111f;
    box-sizing: border-box;
  }

  /* ---------- SPONSOR REEL PLACEHOLDER ---------- */
  .sponsor-block {
    display: none !important;
    position: absolute;
    left: 90px;
    top: 815px;
  }

  .sponsor-label {
    font-style: italic;
    font-weight: 700;
    font-size: 22px;
  }

  .sponsor-reel {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 76px;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* ---------- INFO SCROLLER ---------- */
  .info-scroller {
    position: absolute;
    left: 0;
    bottom: -3px;
    width: 1750px;
    height: 70px;
    background: transparent;
    color: #fff;
    display: flex;
    align-items: center;
    padding-left: 40px;
    box-sizing: border-box;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    overflow: hidden;
    z-index: 40;
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 85%, transparent 100%);
    mask-image: linear-gradient(to right, #000 0%, #000 85%, transparent 100%);
  }

  .info-scroller .scroll-track {
    position: relative;
    top: 12px;
    display: flex;
    white-space: nowrap;
    animation: infoScrollerScroll 180s linear infinite;
  }

  .info-scroller .scroll-track span {
    padding: 0 40px;
  }

  @keyframes infoScrollerScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ---------- CORNER BADGE ---------- */
  .corner-number {
    display: none !important;
    position: absolute;
    left: 9px;
    top: 4px;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    line-height: 1;
  }

  /* ---------- BAKGRUNN (statisk bilde) ---------- */
  .static-bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  /* ---------- BUNNBAR (statisk bilde) ---------- */
  .bottom-bar-image {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 1920px;
    height: auto;
    display: block;
    z-index: 30;
  }

.sponsor-reel-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 40px;
  }

  .sponsor-reel-wrap > img,
  .sponsor-reel-wrap > .sponsor-logo-dark-chip img,
  .sponsor-reel-wrap > .sponsor-logo-light-chip img {
    height: 150px;
    width: auto;
    object-fit: contain;
  }

  .sponsor-reel-wrap > .sponsor-slide-hidden {
    display: none !important;
  }


  .sponsor-logo-dark-chip {
    background: #111;
    padding: 16px 32px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
  }

  .sponsor-logo-light-chip {
    background: #fff;
    padding: 14px 28px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.15);
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    display: inline-flex;
    align-items: center;
  }
</style>
</head>

  <script>
    // ---------------------------------------------------------------
    // Henter og oppdaterer Top 16-listen fra SAMME kontrollpanel/kilde
    // som top16_new.html bruker - identisk oppsett for DATA_URL,
    // fallback-URL, JSONP for file://, og pollintervall.
    // ---------------------------------------------------------------
    const DEFAULT_DATA_URL = "/api/overlay?t=";
    const DEFAULT_FALLBACK_DATA_URL = "https://script.google.com/macros/s/AKfycbz3aep17Ul9e_PVGFBr-bOE71WBlXND_QKne07_bSwGduC3rOm7ITSjD1T3-O3olduG/exec";
    const FLAG_BASE_PATH = "images/flags/";
    const query = new URLSearchParams(window.location.search);
    const DATA_URL = String(query.get("dataUrl") || DEFAULT_DATA_URL).trim();
    const FALLBACK_DATA_URL = String(query.get("fallbackDataUrl") || DEFAULT_FALLBACK_DATA_URL).trim();
    const POLL_MS = Math.max(parseInt(query.get("pollMs"), 10) || 2500, 250);

    let inFlight = false;
    let hasRendered = false;
    let lastRenderSignature = "";

    function normalizeFlagCode(value) {
      if (value == null) return "";

      const aliases = {
        norge: "no", norway: "no", sverige: "se", sweden: "se",
        danmark: "dk", denmark: "dk", finland: "fi",
        england: "gb-eng", scotland: "gb-sct", wales: "gb-wls",
        northernireland: "gb-nir", uk: "gb", unitedkingdom: "gb",
        usa: "us", unitedstates: "us"
      };

      const cleaned = String(value).trim().toLowerCase()
        .replace(/_/g, "-").replace(/\s+/g, "").replace(/[^a-z0-9-]/g, "");

      return aliases[cleaned] || cleaned;
    }

    function readText(value, fallback) {
      const text = String(value ?? "").trim();
      return text || fallback;
    }

    function firstFilled() {
      for (let i = 0; i < arguments.length; i += 1) {
        const value = arguments[i];
        if (value == null) continue;
        if (typeof value === "object") continue;
        const text = String(value).trim();
        if (text) return text;
      }
      return "";
    }

    function looksLikeTop16Payload(data) {
      if (!data || typeof data !== "object") return false;
      if (Array.isArray(data?.top16?.rows) && data.top16.rows.length > 0) return true;
      if (Array.isArray(data?.rows) && data.rows.length > 0) return true;
      if (Array.isArray(data?.standings) && data.standings.length > 0) return true;

      const source = data?.top16 && typeof data.top16 === "object" ? data.top16 : data;
      for (let i = 1; i <= 16; i += 1) {
        const candidate = firstFilled(source?.[`name${i}`], source?.[`spiller${i}`]);
        if (candidate) return true;
      }
      return false;
    }

    function isPlaceholderName(value) {
      const name = String(value || "").trim().toLowerCase();
      if (!name) return true;
      if (name === "player") return true;
      if (/^player\s*\d+$/.test(name)) return true;
      return false;
    }

    function readSource(data) {
      if (data?.top16 && typeof data.top16 === "object") return data.top16;
      if (data?.sceneData?.top16 && typeof data.sceneData.top16 === "object") return data.sceneData.top16;
      if (Array.isArray(data?.standings)) return { rows: data.standings };
      if (Array.isArray(data?.rows)) return { rows: data.rows };
      if (Array.isArray(data)) return { rows: data };
      return data || {};
    }

    function buildRecord(row) {
      const wins = String(row?.wins ?? row?.win ?? row?.seire ?? "").trim();
      const losses = String(row?.losses ?? row?.loss ?? row?.tap ?? "").trim();
      const draws = String(row?.draws ?? row?.draw ?? row?.uavgjort ?? "").trim();
      if (!wins && !losses && !draws) return "";
      return `${wins || "0"}-${losses || "0"}-${draws || "0"}`;
    }

    function readIndexedRows(source) {
      const rows = [];
      for (let i = 1; i <= 16; i += 1) {
        const rank = firstFilled(source?.[`rank${i}`], source?.[`plass${i}`], source?.[`position${i}`], i);
        const name = firstFilled(source?.[`name${i}`], source?.[`player${i}`], source?.[`spiller${i}`]);
        const record = firstFilled(
          source?.[`record${i}`], source?.[`wl${i}`], source?.[`score${i}`], source?.[`standing${i}`]
        );
        const flag = normalizeFlagCode(firstFilled(
          source?.[`flag${i}`], source?.[`flagCode${i}`], source?.[`countryCode${i}`],
          source?.[`country${i}`], source?.[`nation${i}`], source?.[`uid${i}`]
        ));

        if (!name && !record && !flag) continue;

        rows.push({ rank, name: name || "PLAYER", record: record || "0-0-0", flag });
      }
      return rows;
    }

    function readRows(source) {
      const list = Array.isArray(source)
        ? source
        : Array.isArray(source.rows)
        ? source.rows
        : Array.isArray(source.players)
          ? source.players
          : Array.isArray(source.items)
            ? source.items
            : Array.isArray(source.list)
              ? source.list
              : Array.isArray(source.standings)
                ? source.standings
                : Array.isArray(source.top16Rows)
                  ? source.top16Rows
                  : [];

      const indexedRows = !list.length ? readIndexedRows(source) : [];
      const chosenRows = list.length ? list : indexedRows;

      return chosenRows.slice(0, 8).map((row, index) => ({
        rank: row?.rank ?? index + 1,
        name: readText(row?.name, ""),
        record: readText(
          row?.record ?? row?.wl ?? row?.score ?? row?.standing ?? buildRecord(row),
          "0-0-0"
        ),
        flag: normalizeFlagCode(firstFilled(
          row?.flag, row?.flagCode, row?.countryCode, row?.country, row?.nation, row?.uid,
          row?.player?.flag, row?.player?.flagCode, row?.player?.countryCode,
          row?.player?.country, row?.player?.nation, row?.player?.uid
        ))
      })).filter((row) => !isPlaceholderName(row.name));
    }

    function buildRenderSignature(data) {
      const source = readSource(data);
      const rows = readRows(source);
      return JSON.stringify({
        title: readText(source.title ?? data?.sceneTitle, "NORGESMESTERSKAPET"),
        round: readText(source.round ?? source.roundLabel ?? data?.sceneSubtitle, "RUNDE 13"),
        brollLabel: readText(source.brollLabel ?? data?.brollLabel, "fra OlsoMet"),
        logoYear: readText(source.logoYear ?? data?.logoYear, "MTG 2026"),
        logoName: readText(source.logoName ?? data?.logoName, "NORGESMESTERSKAP"),
        cornerNumber: readText(source.cornerNumber ?? data?.cornerNumber, "26"),
        tickerText: readText(source.tickerText ?? data?.tickerText, "INFO SCROLLER >>>>>"),
        rows
      });
    }

    // Panelet er 592px høyt, header + mellomrom tar 37px, resten er
    // tilgjengelig for radene. Radhøyde/skrift/flagg-størrelse skaleres
    // proporsjonalt ut fra hvor mange spillere som faktisk har data,
    // slik at listen alltid fyller flaten uten tomrom, uansett antall.
    const PANEL_HEIGHT = 705;
    const HEADER_HEIGHT = 34;
    const HEADER_GAP = 3;
    const ROW_GAP = 3;
    const BASE_ROW_HEIGHT = 34;
    const MIN_ROW_HEIGHT = 20;
    const MAX_VISUAL_SCALE = 1.6;

    // Rullende info-tekst nederst - hentes fra tickerText (samme felt
    // Top16CasterDeskFULL.html allerede bruker), duplisert for en
    // somlos looping marquee-effekt. Bygger bare om DOM-en nar teksten
    // faktisk har endret seg, slik at scroll-animasjonen ikke
    // hakker/restarter hvert poll.
    const DEFAULT_SCROLLER_TEXT = "INFO SCROLLER >>>>>";
    let lastScrollerText = null;

    function updateScrollerTicker(text) {
      const track = document.getElementById("scrollerTrack");
      if (!track || text === lastScrollerText) return;
      lastScrollerText = text;

      const repeated = Array(10).fill(text).map((t) => "<span>" + t + "</span>").join("");
      track.innerHTML = repeated + repeated;
    }

    function applyRowSizing(rowsEl, count) {
      // Fast antall "sloter" (8), uavhengig av hvor mange rader som
      // faktisk finnes - stoerrelsen skal ikke endre seg om det er
      // faerre eller flere enn 8 spillere i kilden.
      const n = 8;
      const available = PANEL_HEIGHT - HEADER_HEIGHT - HEADER_GAP;
      const rowHeight = Math.max((available - (n - 1) * ROW_GAP) / n, MIN_ROW_HEIGHT);
      const visualScale = Math.min(rowHeight / BASE_ROW_HEIGHT, MAX_VISUAL_SCALE);
      rowsEl.style.setProperty("--row-height", rowHeight + "px");
      rowsEl.style.setProperty("--scale", visualScale);
    }

    // Krymper skriftstørrelsen for ETT enkelt navn hvis det ikke får
    // plass innenfor kolonnens faktiske bredde - se samme funksjon i
    // top16_new.html for full forklaring.
    function fitNameToWidth(nameEl) {
      if (!nameEl) return;

      const computedStyle = window.getComputedStyle(nameEl);
      const baseFontSize = parseFloat(computedStyle.fontSize);
      if (!baseFontSize) return;

      let fontSize = baseFontSize;
      nameEl.style.fontSize = fontSize + "px";

      let guard = 0;
      while (nameEl.scrollWidth > nameEl.clientWidth && fontSize > 8 && guard < 40) {
        fontSize -= 0.5;
        nameEl.style.fontSize = fontSize + "px";
        guard += 1;
      }
    }

    function render(data) {
      const signature = buildRenderSignature(data);
      if (signature === lastRenderSignature) return;
      lastRenderSignature = signature;

      const source = readSource(data);
      hasRendered = true;
      const titleEl = document.getElementById("widgetTitle");
      const roundEl = document.getElementById("widgetRound");
      const rowsEl = document.getElementById("widgetRows");

      if (titleEl) titleEl.innerText = readText(source.title ?? data?.sceneTitle, "NORGESMESTERSKAPET");
      if (roundEl) roundEl.innerText = readText(source.round ?? source.roundLabel ?? data?.sceneSubtitle, "RUNDE 13");

      const brollLabelEl = document.getElementById("brollLabel");
      const logoYearEl = document.getElementById("logoYear");
      const logoNameEl = document.getElementById("logoName");
      const cornerNumberEl = document.getElementById("cornerNumber");

      if (brollLabelEl) brollLabelEl.innerText = readText(source.brollLabel ?? data?.brollLabel, "fra OlsoMet");
      if (logoYearEl) logoYearEl.innerText = readText(source.logoYear ?? data?.logoYear, "MTG 2026");
      if (logoNameEl) logoNameEl.innerText = readText(source.logoName ?? data?.logoName, "NORGESMESTERSKAP");
      if (cornerNumberEl) cornerNumberEl.innerText = readText(source.cornerNumber ?? data?.cornerNumber, "26");

      updateScrollerTicker(readText(source.tickerText ?? data?.tickerText, DEFAULT_SCROLLER_TEXT));

      if (!rowsEl) return;

      const rows = readRows(source);
      rowsEl.innerHTML = "";

      if (!rows.length) {
        applyRowSizing(rowsEl, 1);
        const fallback = document.createElement("div");
        fallback.className = "top16-row empty";
        fallback.innerHTML = '<div class="rank">-</div><div></div><div class="name">INGEN TOP 16 DATA</div><div class="record">-</div>';
        rowsEl.appendChild(fallback);
        return;
      }

      applyRowSizing(rowsEl, rows.length);

      rows.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "top16-row";

        const rankEl = document.createElement("div");
        rankEl.className = "rank";
        rankEl.innerText = row.rank;

        const flagEl = document.createElement("img");
        flagEl.className = "flag";
        flagEl.alt = "flag";
        if (row.flag) {
          flagEl.src = FLAG_BASE_PATH + row.flag + ".png";
        } else {
          flagEl.style.visibility = "hidden";
        }
        flagEl.onerror = () => { flagEl.style.visibility = "hidden"; };

        const nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.innerText = row.name;

        const recordEl = document.createElement("div");
        recordEl.className = "record";
        recordEl.innerText = row.record;

        rowEl.appendChild(rankEl);
        rowEl.appendChild(flagEl);
        rowEl.appendChild(nameEl);
        rowEl.appendChild(recordEl);
        rowsEl.appendChild(rowEl);
      });

      // Ma kjores ETTER at radene er lagt til i DOM-en - clientWidth/
      // scrollWidth er kun korrekte nar elementet faktisk er en del
      // av det gjengitte dokumentet.
      rowsEl.querySelectorAll(".name").forEach(fitNameToWidth);
    }

    // Google Apps Script blokkerer CORS fra "null"-opphav (file://),
    // sa JSONP brukes som fallback nar filen apnes direkte.
    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = "widgetCb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        let settled = false;

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (data) => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error("JSONP request failed: " + url));
        };

        const separator = url.includes("?") ? "&" : "?";
        script.src = url + separator + "callback=" + callbackName;
        document.head.appendChild(script);

        setTimeout(() => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error("JSONP request timed out: " + url));
        }, 45000);
      });
    }

    function appendTimestamp(url, timestamp) {
      const clean = String(url || "").trim();
      if (!clean) return "";
      if (/[?&]t=$/.test(clean)) return clean + timestamp;
      if (clean.includes("?")) return clean + "&t=" + timestamp;
      return clean + "?t=" + timestamp;
    }

    async function fetchTop16Data(url) {
      if (window.location.protocol === "file:") {
        return fetchJSONP(url);
      }
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error("Top16 fetch failed: " + response.status);
      }
      return response.json();
    }

    async function update() {
      if (inFlight) return;
      inFlight = true;

      try {
        const urlsToTry = [DATA_URL, FALLBACK_DATA_URL].filter((url, index, arr) => {
          const normalized = String(url || "").trim();
          if (!normalized) return false;
          return arr.findIndex((u) => String(u || "").trim() === normalized) === index;
        });

        let data = null;
        let lastError = null;

        for (const url of urlsToTry) {
          try {
            const candidate = await fetchTop16Data(appendTimestamp(url, Date.now()));
            if (looksLikeTop16Payload(candidate)) {
              data = candidate;
              break;
            }
            if (!data) data = candidate;
          } catch (error) {
            lastError = error;
          }
        }

        if (!data) throw lastError || new Error("No Top16 data source available");

        render(data);
      } catch (error) {
        console.error("[STREAM-STARTING-WIDGET]", error);
        if (!hasRendered) render({});
      } finally {
        inFlight = false;
      }
    }

    render({});
    update();
    setInterval(update, POLL_MS);
  </script>

  <script>
    // Skalerer det faste 1920x1080-designet ned/opp til a fylle det
    // faktiske vinduet/OBS Browser Source-storrelsen, med riktig
    // bilde-proporsjon bevart og sentrert.
    (function () {
      const overlay = document.querySelector(".overlay");
      if (!overlay) return;

      function scaleOverlay() {
        const scaleX = window.innerWidth / 1920;
        const scaleY = window.innerHeight / 1080;
        const scale = Math.min(scaleX, scaleY);
        overlay.style.transform = "scale(" + scale + ")";
      }

      window.addEventListener("resize", scaleOverlay);
      scaleOverlay();
    })();
  </script>

  <script>
    // Sponsor-slideshow: den flate raden med sponsorlogoer (i
    // .sponsor-reel-wrap) grupperes i "slides" pa 3 og 3, i den
    // rekkefolgen de allerede star i markup-en, og bytter til neste
    // gruppe hvert 30. sekund. Rorer ikke selve bilde-elementene eller
    // "chip"-innpakningen - bytter kun hvilke som er synlige.
    (function () {
      const SLIDE_MS = 30000;
      const ITEMS_PER_SLIDE = 3;

      const wrap = document.querySelector(".sponsor-reel-wrap");
      if (!wrap) return;

      const items = Array.from(wrap.children);
      if (items.length <= ITEMS_PER_SLIDE) return;

      const slides = [];
      for (let i = 0; i < items.length; i += ITEMS_PER_SLIDE) {
        slides.push(items.slice(i, i + ITEMS_PER_SLIDE));
      }

      let current = 0;

      function showSlide(index) {
        items.forEach(function (item) {
          item.classList.add("sponsor-slide-hidden");
        });
        (slides[index] || []).forEach(function (item) {
          item.classList.remove("sponsor-slide-hidden");
        });
      }

      showSlide(current);

      setInterval(function () {
        current = (current + 1) % slides.length;
        showSlide(current);
      }, SLIDE_MS);
    })();
  </script>
