<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top16 Caster Desk Full</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Playfair+Display:ital,wght@1,700&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Sora', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #223041;
    overflow: hidden;
    color: #111;
  }

  /* ---------- TOP-RIGHT LOGO BOX ---------- */
  .logo-box {
    position: absolute;
    right: 0;
    top: 0;
    width: 260px;
    height: 96px;
    background: #000;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    box-sizing: border-box;
  }

  .logo-box img {
    height: 56px;
    width: auto;
    flex-shrink: 0;
  }

  .logo-box-text-year {
    font-size: 20px;
    font-weight: 400;
    color: #fff;
    line-height: 1.2;
  }

  .logo-box-text-name {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
    letter-spacing: 0.5px;
  }

  /* ---------- CAMERA / B-ROLL PLACEHOLDER ---------- */
  .cam-box {
    display: none;
  }

  /* ---------- TOP16 PANEL (same live-data logic as StreamStartingWidget) ---------- */
  .top16-panel {
    position: absolute;
    left: 40px;
    top: 170px;
    width: 440px;
    height: 652px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-transform: uppercase;
  }

  .top16-header {
    height: 34px;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 16px;
    font-weight: 800;
    gap: 8px;
  }

  .top16-header .title-group {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }

  .top16-header .crown {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .top16-header #widgetTitle {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top16-header #widgetRound {
    white-space: nowrap;
    flex-shrink: 0;
  }

  .top16-rows {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    --scale: 1;
    --row-height: 34px;
  }

  .top16-row {
    height: var(--row-height);
    display: grid;
    grid-template-columns: calc(26px * var(--scale)) calc(34px * var(--scale)) 1fr calc(66px * var(--scale));
    align-items: center;
    background: linear-gradient(90deg, #9f0c22 0%, #c71535 72%, #c71434 100%);
    color: #fff;
    font-weight: 800;
    border-radius: 8px !important;
    overflow: hidden !important;
  }

  .top16-row .rank {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(16px * var(--scale));
    background: #000;
    border-radius: 8px 0 0 8px !important;
  }

  .top16-row .flag {
    width: calc(26px * var(--scale));
    height: calc(18px * var(--scale));
    justify-self: center;
    object-fit: cover;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
  }

  .top16-row .name {
    padding-left: calc(6px * var(--scale));
    font-size: calc(14px * var(--scale));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top16-row .record {
    text-align: center;
    font-size: calc(14px * var(--scale));
  }

  .top16-row.empty {
    opacity: 0.8;
  }

  /* ---------- CASTERS DESK BAR ---------- */
  .casters-bar {
    position: absolute;
    left: 40px;
    top: 846px;
    width: 1840px;
    height: 140px;
    background: transparent;
    display: flex;
    align-items: center;
    color: #fff;
    box-sizing: border-box;
    padding: 0 40px;
    gap: 36px;
  }

  .casters-logo {
    height: 62px;
    width: auto;
    flex-shrink: 0;
  }

  .casters-title-group {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-shrink: 0;
  }

  .casters-title {
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
  }

  .casters-subtitle {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 4px;
  }

  #castersDay {
    font-size: 16px;
    font-weight: 800;
    white-space: nowrap;
  }

  #castersYear {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.9;
    white-space: nowrap;
  }

  .casters-divider {
    width: 2px;
    align-self: stretch;
    background: rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }

  .commentators-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    min-width: 0;
  }

  .commentators-label {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    opacity: 0.85;
    margin-bottom: 4px;
  }

  .commentators-names {
    display: flex;
    align-items: flex-start;
    gap: 28px;
    flex-wrap: wrap;
  }

  .commentator {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .commentator-sep {
    opacity: 0.6;
    font-weight: 400;
    align-self: center;
  }

  .commentator-name {
    font-size: 20px;
    font-weight: 400;
    white-space: nowrap;
  }

  .commentator-lastname {
    font-weight: 800;
  }

  .commentator-tag {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.85;
    white-space: nowrap;
  }

  .sponsor-slot {
    display: none;
  }

  /* ---------- SCROLLING INFO TICKER ---------- */
  .info-ticker {
    position: absolute;
    left: 0;
    top: 1013px;
    width: 1750px;
    height: 70px;
    overflow: hidden;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    z-index: 10;
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 85%, transparent 100%);
    mask-image: linear-gradient(to right, #000 0%, #000 85%, transparent 100%);
  }

  .info-ticker-track {
    position: relative;
    top: 12px;
    display: flex;
    white-space: nowrap;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: #fff;
    animation: tickerScroll 180s linear infinite;
  }

  .info-ticker-track span {
    padding: 0 28px;
  }

  @keyframes tickerScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ---------- BAKGRUNN (statisk bilde) ---------- */
  .static-bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  .bottom-bar-image {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 1920px;
    height: auto;
    display: block;
    z-index: 5;
  }

.sponsor-reel-wrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .sponsor-reel-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  .sponsor-reel-row.sponsor-slide-hidden {
    display: none;
  }

  .sponsor-reel-row img {
    height: 96px;
    width: auto;
    object-fit: contain;
  }


  .sponsor-logo-dark-chip {
    background: #111;
    padding: 14px 28px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
  }

  .sponsor-logo-light-chip {
    background: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.15);
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    display: inline-flex;
    align-items: center;
  }
</style>
</head>

  <script>
    // ---------------------------------------------------------------
    // Henter og oppdaterer Top 16-listen fra SAMME kontrollpanel/kilde
    // som top16_new.html og StreamStartingWidget.html bruker.
    // ---------------------------------------------------------------
    const DEFAULT_DATA_URL = "/api/overlay?t=";
    const DEFAULT_FALLBACK_DATA_URL = "https://script.google.com/macros/s/AKfycbz3aep17Ul9e_PVGFBr-bOE71WBlXND_QKne07_bSwGduC3rOm7ITSjD1T3-O3olduG/exec";
    const FLAG_BASE_PATH = "images/flags/";
    const query = new URLSearchParams(window.location.search);
    const DATA_URL = String(query.get("dataUrl") || DEFAULT_DATA_URL).trim();
    const FALLBACK_DATA_URL = String(query.get("fallbackDataUrl") || DEFAULT_FALLBACK_DATA_URL).trim();
    const POLL_MS = Math.max(parseInt(query.get("pollMs"), 10) || 2500, 250);

    let inFlight = false;
    let hasRendered = false;
    let lastRenderSignature = "";

    // Panelet er 720px hoyt, header + mellomrom tar 37px, resten er
    // tilgjengelig for radene. Radhoyde/skrift/flagg-storrelse skaleres
    // proporsjonalt ut fra hvor mange spillere som faktisk har data,
    // slik at listen alltid fyller flaten uten tomrom, uansett antall.
    const PANEL_HEIGHT = 652;
    const HEADER_HEIGHT = 34;
    const HEADER_GAP = 3;
    const ROW_GAP = 3;
    const BASE_ROW_HEIGHT = 34;
    const MIN_ROW_HEIGHT = 20;
    const MAX_VISUAL_SCALE = 1.6;

    function applyRowSizing(rowsEl, count) {
      const n = Math.max(count, 1);
      const available = PANEL_HEIGHT - HEADER_HEIGHT - HEADER_GAP;
      const rowHeight = Math.max((available - (n - 1) * ROW_GAP) / n, MIN_ROW_HEIGHT);
      const visualScale = Math.min(rowHeight / BASE_ROW_HEIGHT, MAX_VISUAL_SCALE);
      rowsEl.style.setProperty("--row-height", rowHeight + "px");
      rowsEl.style.setProperty("--scale", visualScale);
    }

    function normalizeFlagCode(value) {
      if (value == null) return "";

      const aliases = {
        norge: "no", norway: "no", sverige: "se", sweden: "se",
        danmark: "dk", denmark: "dk", finland: "fi",
        england: "gb-eng", scotland: "gb-sct", wales: "gb-wls",
        northernireland: "gb-nir", uk: "gb", unitedkingdom: "gb",
        usa: "us", unitedstates: "us"
      };

      const cleaned = String(value).trim().toLowerCase()
        .replace(/_/g, "-").replace(/\s+/g, "").replace(/[^a-z0-9-]/g, "");

      return aliases[cleaned] || cleaned;
    }

    function readText(value, fallback) {
      const text = String(value ?? "").trim();
      return text || fallback;
    }

    // Splitter navn i fornavn/etternavn naar arket ikke (ennaa) har
    // egne celler for dette - etternavn = siste "ord" i navnet.
    function splitName(fullName) {
      const text = String(fullName ?? "").trim();
      if (!text) return { first: "", last: "" };
      const parts = text.split(/\s+/);
      if (parts.length === 1) return { first: "", last: parts[0] };
      const last = parts.pop();
      return { first: parts.join(" "), last };
    }

    function readNameParts(data, prefix, fullNameFallback) {
      const fullName = readText(data?.[prefix + "Name"], fullNameFallback);
      const firstField = data?.[prefix + "FirstName"];
      const lastField = data?.[prefix + "LastName"];
      const hasFirst = firstField != null && String(firstField).trim() !== "";
      const hasLast = lastField != null && String(lastField).trim() !== "";

      if (!hasFirst && !hasLast) {
        return splitName(fullName);
      }

      let first = hasFirst ? readText(firstField, "") : "";
      let last = hasLast ? readText(lastField, "") : "";

      // Bare "etternavn"-cellen er fylt ut - resten av navnet (fornavn)
      // hentes automatisk fra den eksisterende navn-cellen. Navn-cellen
      // kan enten inneholde HELE navnet ("Kim Bakken", der etternavnet
      // matcher slutten) eller BARE fornavnet ("Kim") mens etternavnet
      // kun star i den egne cellen - i begge tilfeller skal fornavn-
      // delen som vises vaere det som star i navn-cellen.
      if (!hasFirst && hasLast) {
        const trimmedLast = last.trim();
        const upperFull = fullName.toUpperCase();
        const upperLast = trimmedLast.toUpperCase();
        if (trimmedLast && upperFull.endsWith(upperLast) && fullName.trim().toUpperCase() !== upperLast) {
          // Navn-cellen inneholder hele navnet ("Kim Bakken") -
          // trekk fra etternavnet fra slutten, resten er fornavnet.
          first = fullName.slice(0, fullName.length - trimmedLast.length).trim();
        } else {
          // Navn-cellen inneholder bare fornavnet ("Kim") - bruk den
          // som den er, uten a proeve a dele den opp videre.
          first = fullName.trim();
        }
      }

      // Bare "fornavn"-cellen er fylt ut - etternavnet hentes fra
      // slutten av den eksisterende navn-cellen.
      if (hasFirst && !hasLast) {
        last = splitName(fullName).last;
      }

      return { first, last };
    }

    function firstFilled() {
      for (let i = 0; i < arguments.length; i += 1) {
        const value = arguments[i];
        if (value == null) continue;
        if (typeof value === "object") continue;
        const text = String(value).trim();
        if (text) return text;
      }
      return "";
    }

    function looksLikeTop16Payload(data) {
      if (!data || typeof data !== "object") return false;
      if (Array.isArray(data?.top16?.rows) && data.top16.rows.length > 0) return true;
      if (Array.isArray(data?.rows) && data.rows.length > 0) return true;
      if (Array.isArray(data?.standings) && data.standings.length > 0) return true;

      const source = data?.top16 && typeof data.top16 === "object" ? data.top16 : data;
      for (let i = 1; i <= 16; i += 1) {
        const candidate = firstFilled(source?.[`name${i}`], source?.[`spiller${i}`]);
        if (candidate) return true;
      }
      return false;
    }

    function isPlaceholderName(value) {
      const name = String(value || "").trim().toLowerCase();
      if (!name) return true;
      if (name === "player") return true;
      if (/^player\s*\d+$/.test(name)) return true;
      return false;
    }

    function readSource(data) {
      if (data?.top16 && typeof data.top16 === "object") return data.top16;
      if (data?.sceneData?.top16 && typeof data.sceneData.top16 === "object") return data.sceneData.top16;
      if (Array.isArray(data?.standings)) return { rows: data.standings };
      if (Array.isArray(data?.rows)) return { rows: data.rows };
      if (Array.isArray(data)) return { rows: data };
      return data || {};
    }

    function buildRecord(row) {
      const wins = String(row?.wins ?? row?.win ?? row?.seire ?? "").trim();
      const losses = String(row?.losses ?? row?.loss ?? row?.tap ?? "").trim();
      const draws = String(row?.draws ?? row?.draw ?? row?.uavgjort ?? "").trim();
      if (!wins && !losses && !draws) return "";
      return `${wins || "0"}-${losses || "0"}-${draws || "0"}`;
    }

    function readIndexedRows(source) {
      const rows = [];
      for (let i = 1; i <= 16; i += 1) {
        const rank = firstFilled(source?.[`rank${i}`], source?.[`plass${i}`], source?.[`position${i}`], i);
        const name = firstFilled(source?.[`name${i}`], source?.[`player${i}`], source?.[`spiller${i}`]);
        const record = firstFilled(
          source?.[`record${i}`], source?.[`wl${i}`], source?.[`score${i}`], source?.[`standing${i}`]
        );
        const flag = normalizeFlagCode(firstFilled(
          source?.[`flag${i}`], source?.[`flagCode${i}`], source?.[`countryCode${i}`],
          source?.[`country${i}`], source?.[`nation${i}`], source?.[`uid${i}`]
        ));

        if (!name && !record && !flag) continue;

        rows.push({ rank, name: name || "PLAYER", record: record || "0-0-0", flag });
      }
      return rows;
    }

    function readRows(source) {
      const list = Array.isArray(source)
        ? source
        : Array.isArray(source.rows)
        ? source.rows
        : Array.isArray(source.players)
          ? source.players
          : Array.isArray(source.items)
            ? source.items
            : Array.isArray(source.list)
              ? source.list
              : Array.isArray(source.standings)
                ? source.standings
                : Array.isArray(source.top16Rows)
                  ? source.top16Rows
                  : [];

      const indexedRows = !list.length ? readIndexedRows(source) : [];
      const chosenRows = list.length ? list : indexedRows;

      return chosenRows.slice(0, 16).map((row, index) => ({
        rank: row?.rank ?? index + 1,
        name: readText(row?.name, ""),
        record: readText(
          row?.record ?? row?.wl ?? row?.score ?? row?.standing ?? buildRecord(row),
          "0-0-0"
        ),
        flag: normalizeFlagCode(firstFilled(
          row?.flag, row?.flagCode, row?.countryCode, row?.country, row?.nation, row?.uid,
          row?.player?.flag, row?.player?.flagCode, row?.player?.countryCode,
          row?.player?.country, row?.player?.nation, row?.player?.uid
        ))
      })).filter((row) => !isPlaceholderName(row.name));
    }

    function buildRenderSignature(data) {
      const source = readSource(data);
      const rows = readRows(source);
      return JSON.stringify({
        title: readText(source.title ?? data?.sceneTitle, "NORGESMESTERSKAPET"),
        round: readText(source.round ?? source.roundLabel ?? data?.sceneSubtitle, "RUNDE 13"),
        castersDay: readText(data?.castersDay, "DAY 2 - TOP 8"),
        castersYear: readText(data?.castersYear, "2026 NM"),
        caster1Name: readText(data?.caster1Name, "THOMAS NAVNESEN"),
        caster1FirstName: readText(data?.caster1FirstName, ""),
        caster1LastName: readText(data?.caster1LastName, ""),
        caster1Tag: readText(data?.caster1Tag, "ALL FOIL DECKS = BETTER"),
        caster2Name: readText(data?.caster2Name, "RUBEN STREAMING"),
        caster2FirstName: readText(data?.caster2FirstName, ""),
        caster2LastName: readText(data?.caster2LastName, ""),
        caster2Tag: readText(data?.caster2Tag, "CASUAL LANDFALL ENJOYER"),
        sponsorSlot: readText(data?.sponsorSlot, "[sponsor reel]"),
        tickerText: readText(data?.tickerText, "SCROLLING INFO >>>>>"),
        rows
      });
    }

    function render(data) {
      const signature = buildRenderSignature(data);
      if (signature === lastRenderSignature) return;
      lastRenderSignature = signature;

      const source = readSource(data);
      hasRendered = true;
      const titleEl = document.getElementById("widgetTitle");
      const roundEl = document.getElementById("widgetRound");
      const rowsEl = document.getElementById("widgetRows");

      if (titleEl) titleEl.innerText = readText(source.title ?? data?.sceneTitle, "NORGESMESTERSKAPET");
      if (roundEl) roundEl.innerText = readText(source.round ?? source.roundLabel ?? data?.sceneSubtitle, "RUNDE 13");

      const castersDayEl = document.getElementById("castersDay");
      const castersYearEl = document.getElementById("castersYear");
      const caster1FirstEl = document.getElementById("caster1First");
      const caster1LastEl = document.getElementById("caster1Last");
      const caster1TagEl = document.getElementById("caster1Tag");
      const caster2FirstEl = document.getElementById("caster2First");
      const caster2LastEl = document.getElementById("caster2Last");
      const caster2TagEl = document.getElementById("caster2Tag");

      if (castersDayEl) castersDayEl.innerText = readText(data?.castersDay, "DAY 2 - TOP 8");
      if (castersYearEl) castersYearEl.innerText = readText(data?.castersYear, "2026 NM");

      const caster1Parts = readNameParts(data, "caster1", "THOMAS NAVNESEN");
      if (caster1FirstEl) caster1FirstEl.innerText = caster1Parts.first;
      if (caster1LastEl) caster1LastEl.innerText = caster1Parts.last;
      if (caster1TagEl) caster1TagEl.innerText = readText(data?.caster1Tag, "ALL FOIL DECKS = BETTER");

      const caster2Parts = readNameParts(data, "caster2", "RUBEN STREAMING");
      if (caster2FirstEl) caster2FirstEl.innerText = caster2Parts.first;
      if (caster2LastEl) caster2LastEl.innerText = caster2Parts.last;
      if (caster2TagEl) caster2TagEl.innerText = readText(data?.caster2Tag, "CASUAL LANDFALL ENJOYER");

      updateTicker(readText(data?.tickerText, DEFAULT_TICKER_TEXT));

      if (!rowsEl) return;

      const rows = readRows(source);
      rowsEl.innerHTML = "";

      if (!rows.length) {
        applyRowSizing(rowsEl, 1);
        const fallback = document.createElement("div");
        fallback.className = "top16-row empty";
        fallback.innerHTML = '<div class="rank">-</div><div></div><div class="name">INGEN TOP 16 DATA</div><div class="record">-</div>';
        rowsEl.appendChild(fallback);
        return;
      }

      applyRowSizing(rowsEl, rows.length);

      rows.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "top16-row";

        const rankEl = document.createElement("div");
        rankEl.className = "rank";
        rankEl.innerText = row.rank;

        const flagEl = document.createElement("img");
        flagEl.className = "flag";
        flagEl.alt = "flag";
        if (row.flag) {
          flagEl.src = FLAG_BASE_PATH + row.flag + ".png";
        } else {
          flagEl.style.visibility = "hidden";
        }
        flagEl.onerror = () => { flagEl.style.visibility = "hidden"; };

        const nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.innerText = row.name;

        const recordEl = document.createElement("div");
        recordEl.className = "record";
        recordEl.innerText = row.record;

        rowEl.appendChild(rankEl);
        rowEl.appendChild(flagEl);
        rowEl.appendChild(nameEl);
        rowEl.appendChild(recordEl);
        rowsEl.appendChild(rowEl);

        // Krymper skriften kun for DETTE navnet hvis det ikke far
        // plass innenfor kolonnebredden, i stedet for at hele listen
        // skaleres likt eller at navnet bare kuttes med "..." - samme
        // fiks som top16_new.html og StreamStartingWidget.html
        // allerede bruker. Ma skje ETTER at raden er lagt til i DOM-en,
        // siden vi trenger den ekte, gjengitte bredden.
        const stillTooLong = shrinkNameToFit(nameEl);

        // Hvis navnet fortsatt ikke far plass selv ved skrift-gulvet
        // (ekstremt lange navn) - la det heller brekke til to linjer
        // og la raden vokse litt i hoyden, i stedet for a krympe
        // skriften ned til nesten uleselig storrelse.
        if (stillTooLong) {
          nameEl.style.whiteSpace = "normal";
          nameEl.style.lineHeight = "1.05";
          nameEl.style.wordBreak = "break-word";
          rowEl.style.height = "auto";
          rowEl.style.minHeight = "var(--row-height)";
          rowEl.style.paddingTop = "2px";
          rowEl.style.paddingBottom = "2px";
        }
      });
    }

    function shrinkNameToFit(el) {
      if (!el) return false;
      let fontSize = parseFloat(window.getComputedStyle(el).fontSize);
      const minFontSize = fontSize * 0.75;
      while (el.scrollWidth > el.clientWidth && fontSize > minFontSize) {
        fontSize -= 1;
        el.style.fontSize = fontSize + "px";
      }
      return el.scrollWidth > el.clientWidth;
    }

    // Google Apps Script blokkerer CORS fra "null"-opphav (file://),
    // sa JSONP brukes som fallback nar filen apnes direkte.
    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = "casterDeskCb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        let settled = false;

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (data) => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error("JSONP request failed: " + url));
        };

        const separator = url.includes("?") ? "&" : "?";
        script.src = url + separator + "callback=" + callbackName;
        document.head.appendChild(script);

        setTimeout(() => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error("JSONP request timed out: " + url));
        }, 45000);
      });
    }

    function appendTimestamp(url, timestamp) {
      const clean = String(url || "").trim();
      if (!clean) return "";
      if (/[?&]t=$/.test(clean)) return clean + timestamp;
      if (clean.includes("?")) return clean + "&t=" + timestamp;
      return clean + "?t=" + timestamp;
    }

    async function fetchLocalData() {
      // Slar sammen /api/scenes/casterdesk (caster-navn/tags/sponsor/
      // ticker + top16) - ETT kall dekker alt denne siden trenger,
      // siden backend allerede bygger top16-listen inn i samme svar.
      const res = await fetch("http://localhost:4848/api/scenes/casterdesk", { cache: "no-store" });
      if (!res.ok) throw new Error("CasterDesk fetch failed: " + res.status);
      return res.json();
    }

    async function update() {
      if (inFlight) return;
      inFlight = true;

      try {
        const data = await fetchLocalData();
        render(data);
      } catch (error) {
        console.error("[TOP16-CASTER-DESK]", error);
        if (!hasRendered) render({});
      } finally {
        inFlight = false;
      }
    }

    // ---------------------------------------------------------------
    // Rullende info-tekst nederst - hentes fra kontrollpanelet
    // (tickerText), dupliseres for en somlos looping marquee-effekt.
    // Bygger bare om DOM-en nar teksten faktisk har endret seg, slik
    // at scroll-animasjonen ikke hakker/restarter hvert poll.
    // ---------------------------------------------------------------
    const DEFAULT_TICKER_TEXT = "SCROLLING INFO >>>>>";
    let lastTickerText = null;

    function updateTicker(text) {
      const track = document.getElementById("tickerTrack");
      if (!track) return;
      if (text === lastTickerText) return;
      lastTickerText = text;

      const repeated = Array(10).fill(text).map((t) => "<span>" + t + "</span>").join("");
      track.innerHTML = repeated + repeated;
    }

    render({});
    update();
    setInterval(update, POLL_MS);
  </script>

  <script>
    // Skalerer det faste 1920x1080-designet ned/opp til a fylle det
    // faktiske vinduet/OBS Browser Source-storrelsen, med riktig
    // bilde-proporsjon bevart og sentrert.
    (function () {
      const overlay = document.querySelector(".overlay");
      if (!overlay) return;

      function scaleOverlay() {
        const scaleX = window.innerWidth / 1920;
        const scaleY = window.innerHeight / 1080;
        const scale = Math.min(scaleX, scaleY);
        overlay.style.transform = "scale(" + scale + ")";
      }

      window.addEventListener("resize", scaleOverlay);
      scaleOverlay();
    })();
  </script>

  <script>
    // Sponsor-slideshow: viser gruppene av 3 sponsorlogoer (hver
    // eksisterende .sponsor-reel-row) EN OM GANGEN, i den rekkefolgen
    // de allerede star i markup-en, og bytter til neste gruppe hvert
    // 30. sekund. Rorer ikke selve bilde-elementene eller
    // "chip"-innpakningen - bytter kun hvilken RAD som er synlig.
    (function () {
      const SLIDE_MS = 30000;

      const rows = Array.from(document.querySelectorAll(".sponsor-reel-wrap .sponsor-reel-row"));
      if (rows.length <= 1) return;

      let current = 0;

      function showSlide(index) {
        rows.forEach(function (row, i) {
          row.classList.toggle("sponsor-slide-hidden", i !== index);
        });
      }

      showSlide(current);

      setInterval(function () {
        current = (current + 1) % rows.length;
        showSlide(current);
      }, SLIDE_MS);
    })();
  </script>
